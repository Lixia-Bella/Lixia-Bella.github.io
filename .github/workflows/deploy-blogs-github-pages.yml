# 适用于：Git 仓库根目录 = 本博客项目（package.json 在根目录）
# 推送到 GitHub 后，工作流须位于仓库根 .github/workflows/（即本文件所在位置）
#
# 若仓库名为「<用户名>.github.io」（用户主页），构建会自动使用 VITE_BASE_PATH=/ ，
# 对应站点 https://<用户名>.github.io/ ，切勿再写成 /<仓库名>/ 。

name: Deploy blogs to GitHub Pages

on:
    push:
        branches: [main, master]
        paths:
            - 'src/**'
            - 'public/**'
            - 'package.json'
            - 'package-lock.json'
            - 'vite.config.js'
            - 'index.html'
            - 'eslint.config.js'
            - '.github/workflows/deploy-blogs-github-pages.yml'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages-blogs'
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: npm
                  cache-dependency-path: package-lock.json

            - name: Install dependencies
              run: npm ci

            # 用户主页：仓库名 *.github.io → VITE_BASE_PATH=/
            # 项目站：https://<owner>.github.io/<repo>/ → VITE_BASE_PATH=/<repo>/
            - name: Set VITE_BASE_PATH
              run: |
                  REPO="${GITHUB_REPOSITORY##*/}"
                  if [[ "$REPO" == *.github.io ]]; then
                    echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
                    echo "Detected user Pages repo, VITE_BASE_PATH=/"
                  else
                    echo "VITE_BASE_PATH=/${REPO}/" >> "$GITHUB_ENV"
                    echo "Detected project Pages repo, VITE_BASE_PATH=/${REPO}/"
                  fi

            - name: Build
              run: npm run build

            # 确认上传的是 Vite 产物（应引用 /assets/*.js），避免误把源码 index 部署上去
            - name: Verify dist index
              run: |
                  grep -q 'src="/src/main.jsx"' dist/index.html && { echo '错误：dist/index.html 仍指向源码 main.jsx，构建异常'; exit 1; } || true
                  grep -qE 'src="[^"]*assets/index-[^"]+\.js"' dist/index.html || { echo '错误：dist/index.html 未找到打包后的 assets/*.js'; exit 1; }
                  echo 'dist/index.html 校验通过：'
                  grep -E '<script|link rel="stylesheet"' dist/index.html || true

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deploy.outputs.page_url }}
        steps:
            - id: deploy
              uses: actions/deploy-pages@v4
